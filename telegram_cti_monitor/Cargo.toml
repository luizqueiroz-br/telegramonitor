[package]
name = "telegram_cti_monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jiff = "0.2"
grammers-client = { version = "0.12", default-features = false }
grammers-session = { version = "0.12", features = ["sqlite-storage"] }
libsql = { version = "0.10", default-features = false, features = ["core"] }
